<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Contact card</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <p class="prompt">$ whoami</p>
    <h1>Contact card</h1>
    <section id="contact" aria-label="Contact details" hidden></section>
    <p id="status" role="status" aria-live="polite">Opening contact…</p>
    <a id="download" class="button" download="contact.vcf" hidden>Add contact / Download vCard</a>
    <noscript>Enable JavaScript to open this encrypted contact.</noscript>
    <footer>Decrypted locally in your browser.</footer>
  </main>
</body>
</html>
